name: Airbnb CI/CD Pipeline

on:
  push:
    branches:
      - phase-14-complete

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Application
        run: mvn clean package -DskipTests

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t jessemukesh/airbnb-app:latest .

      - name: Push Docker Image
        run: docker push jessemukesh/airbnb-app:latest

      - name: Create SSH Key
        run: |
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > ansible-key.pem
          chmod 600 ansible-key.pem

      - name: Deploy via Ansible
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i ansible-key.pem \
          ubuntu@54.221.80.125 \
          "cd ~/ansible-lab && ansible-playbook -i inventory deploy-airbnb-playbook.yml"
